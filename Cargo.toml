[package]
name = "rtp-audio"
version = "0.4.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11"
cpal = "0.18.2"
rtrb = "0.3.5"
gethostname = "1"
getrandom = "0.4"
if-addrs = "0.15"
opus = "0.4"
socket2 = "0.6"
tungstenite = "0.30"

[features]
# Carry the window program (src/gui, built first) inside rtp-audio, for `rtp-audio --gui`:
# RTP_AUDIO_GUI_BIN=src/gui/target/release/rtp-audio-gui cargo build --release --features embed-gui
# rtp-audio itself never links the window's libraries (WebKit): only that program does.
embed-gui = []

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Play through the sound server (PipeWire or PulseAudio) when it runs: its outputs, shared with
# other programs and buffered by it, instead of sound cards opened directly. ALSA otherwise.
cpal = { version = "0.18.2", features = ["pulseaudio", "realtime-dbus"] }
libc = "0.2"
libpulse-binding = "2.30"
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
