[package]
name = "rtp-audio"
version = "0.4.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11"
cpal = "0.18.2"
gethostname = "1"
getrandom = "0.4"
if-addrs = "0.15"
opus = "0.4"
socket2 = "0.6"
tungstenite = "0.30"

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Play through the sound server (PipeWire or PulseAudio) when it runs: its outputs, shared with
# other programs and buffered by it, instead of sound cards opened directly. ALSA otherwise.
cpal = { version = "0.18.2", features = ["pulseaudio"] }
libc = "0.2"
libpulse-binding = "2.30"
signal-hook = "0.4"
