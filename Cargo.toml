[package]
name = "rtp-audio"
version = "0.4.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11"
cpal = "0.18.2"
rtrb = "0.3.5"
gethostname = "1"
getrandom = "0.4"
if-addrs = "0.15"
opus = "0.4"
socket2 = "0.6"
tungstenite = "0.30"

[build-dependencies]
# rtp-audio.exe's icon and manifest (windows/).
embed-resource = "3"

[features]
# The window, `rtp-audio --gui` (build its page first: src/gui/README.md). Windows and macOS link it
# in. On Linux rtp-audio carries it as a separate program, built first, so rtp-audio itself never
# links WebKit:
# RTP_AUDIO_GUI_BIN=src/gui/target/release/rtp-audio-gui cargo build --release --features gui
gui = ["dep:rtp-audio-gui"]

[profile.release]
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
# Play through the sound server (PipeWire or PulseAudio) when it runs: its outputs, shared with
# other programs and buffered by it, instead of sound cards opened directly. ALSA otherwise.
cpal = { version = "0.18.2", features = ["pulseaudio", "realtime-dbus"] }
libc = "0.2"
libpulse-binding = "2.30"
signal-hook = "0.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rtp-audio-gui = { path = "src/gui", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
