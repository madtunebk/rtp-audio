[package]
name = "rtp-audio-gui"
version = "0.4.0"
edition = "2024"

# The window of `rtp-audio --gui`. On Windows and macOS rtp-audio links the library (their web views
# come with the system); on Linux the program is separate, so rtp-audio itself needs no WebKit:
# rtp-audio carries it (--features gui) and starts it only for --gui.
[lib]
name = "rtp_audio_gui"
path = "window.rs"

[[bin]]
name = "rtp-audio-gui"
path = "main.rs"

[features]
# The page embedded in the program (not served by `npm run dev`).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
