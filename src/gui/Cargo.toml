[package]
name = "rtp-audio-studio"
version = "0.1.0"
edition = "2024"

# The window of `rtp-audio --gui`: built into rtp-audio with `--features gui`.
[lib]
name = "rtp_audio_studio"
path = "lib.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
